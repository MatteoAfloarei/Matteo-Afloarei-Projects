<body>    
<!-- Flexbox: a layout model that allows elements to be aligned and distributed in a container -->
<div class="container">
       <div class="box" id="box1">1</div>
       <div class="box" id="box2">2</div>
       <div class="box" id="box3">3</div>
       <div class="box" id="box4">4</div>
</div>
<!-- Transformation:
 the transformation propety is to  rotate,scale or translate an element  -->
 <div id="box6">Hi</div>

<!--Animations-->
<div id="box9">HI</div>
</body>

    <body>
  <!--I combinators in HTML/CSS (più precisamente in CSS) sono operatori che permettono di selezionare elementi in base alla loro relazione con altri elementi nel documento HTML.\
  ci sono:
  'space' = descendant
  > = child
  + = adjacent sibling
  ~ = general sibling
 -->
  <div id="container">
  <p>This is #1</p>
  <p>This is #2 </p>
  <div>
    <p>This is #3</p>
  </div>
  </div>

  
  <p>This is #4</p>
  <p>This is #5</p>


  <button>Click me</button>
 <!-- i pseudo classi sono usate per selezionare elementi in base allo stato in cui si trovano -->
  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
    <li>Item 4</li>
    <li>Item 5</li>
  </ul>
 <!--pseudo-elements
 i pseudo elementi sono usati per aggiungere contenuti decorativi a degli elementi HTML senza modificare il documento HTML stesso. -->
 <h1>Heading 1</h1>

  </ul>
